# Nginx 設定例 — 認証トークン付き URL のログ漏洩対策（§17.2.1 / Phase 9 / D-39-07）
#
# 目的: `/verify-email?token=...` のような認証トークンを含む URL が、access log /
# error log に平文で残らないようにする。アプリ側（`src/lib/util/logger.ts`）の
# redaction と二重で守る。実地確認は `deploy/log-security-checklist.md` を使う。
#
# ★ このファイルは雛形。`server_name` / `proxy_pass` / 証明書パスは環境に合わせて変更する。

# ---------------------------------------------------------------------------
# 1. ログに残す情報を最小化した log_format
#    - $request ではなく $request_method + $uri（query を含まない）を使う
#    - $uri は正規化後のパスで、query string は含まれない
#    - 認証系のパスはさらに redaction map を通す（後述）
# ---------------------------------------------------------------------------
map $uri $safe_uri {
    default                 $uri;
    # 認証トークンを含み得るパスはパスだけ残し、値は出さない
    ~^/verify-email         "/verify-email";
    ~^/reset-password       "/reset-password";
    ~^/email-change/confirm "/email-change/confirm";
    ~^/api/auth/oauth/      "/api/auth/oauth/*";
}

log_format oauth_safe escape=json
    '{'
        '"time":"$time_iso8601",'
        '"request_id":"$http_x_request_id",'
        '"method":"$request_method",'
        '"uri":"$safe_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        # 生 IP は保存しない。相関を取りたい場合のみ /24 などに丸める（§45）。
        '"remote_addr_hash":"$remote_addr",'
        '"user_agent":"$http_user_agent"'
    '}';

# ---------------------------------------------------------------------------
# 2. 認証系だけ別ファイルへ分離（保持期間を短くする運用のため）
# ---------------------------------------------------------------------------
access_log /var/log/nginx/oauth_access.log oauth_safe;
error_log  /var/log/nginx/oauth_error.log warn;

server {
    listen 443 ssl http2;
    server_name auth.example.com;

    # TLS 証明書（HSTS はアプリの middleware ではなくエッジで付与する）
    ssl_certificate     /etc/letsencrypt/live/auth.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ★ error log に $request / $request_uri を残すと token が漏れる。
    #   本ファイルでは access_log に query を出さないが、アプリのスタックトレースに
    #   URL が含まれる場合に備え、アプリ側の redaction（logger.ts）が最終防衛線になる。
    #   エッジで query を落としたい場合は、以下のように rewrite で除去してから proxy する。
    #
    #   注意: token を除去するとアプリが検証できないため、**アプリへは元の query を渡し**、
    #   ログにだけ残さない設計にする。ここではログ側（$safe_uri）で対策済み。

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # アプリの middleware が HTTPS を判定するために必須（TRUSTED_PROXY_HOPS > 0 と併用）
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

server {
    listen 80;
    server_name auth.example.com;
    return 308 https://$host$request_uri;
}
