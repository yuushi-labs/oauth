# ローカル開発用の PostgreSQL 16（本番は Secret Manager 管理・DB を公開しない: 仕様52章）
services:
  db:
    image: postgres:16-alpine
    container_name: oauth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # 平文パスワードはローカル開発専用。本番では使わない
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    ports:
      # 外部インターフェースには公開しない（localhost のみ）
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: